<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ExampleApp">
  <!--
    Placeholder app icon for the template. Replace it, then run scripts/make-icons.sh.

    The family tile (Ink navy, radius 108 on a 480 square), a periwinkle secondary colour and one
    teal focal element. Four rounded tiles, one lit: it still reads at 16 px, where an app icon has
    to work hardest. Strokes and gradients are fine: scripts/make-icons.sh draws it with rsvg-convert.
  -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="#1B1E2A"/>

  <rect x="128" y="128" width="112" height="112" rx="28" fill="#9AA2D4"/>
  <rect x="272" y="128" width="112" height="112" rx="28" fill="#2DD4BF"/>
  <rect x="128" y="272" width="112" height="112" rx="28" fill="#9AA2D4"/>
  <rect x="272" y="272" width="112" height="112" rx="28" fill="#9AA2D4" fill-opacity="0.45"/>
</svg>
