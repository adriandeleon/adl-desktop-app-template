name: CI

# The fast lane, on every push to master and every pull request: Format and Build & Test. Both are the
# required status checks for master. The Windows and macOS suites are in full-tests.yml (daily, on a
# pull request labelled `full-ci`, and before every release).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # The release workflow's bump pull request is opened with GITHUB_TOKEN, which starts no workflow;
  # dispatch this one on its branch (or close and reopen the pull request) to get the checks.
  workflow_dispatch: {}

# Nothing here writes to the repository. Every action is pinned to a commit SHA with its version in a
# trailing comment; Dependabot keeps both current.
permissions:
  contents: read

# A new push to a pull request cancels the run still going for the previous one. Every other run has a
# group of its own (its commit), so a run on master is never cancelled or dropped.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Palantir Java Format depends on JDK 25-era javac internals: format on JDK 25.
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check formatting
        run: ./mvnw -B --no-transfer-progress spotless:check

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Compiles with NullAway, runs the unit and headless FX tests (-Dglass.platform=Headless: no
      # display, no xvfb), and applies the JaCoCo floors. Formatting is the other job's.
      - name: Build and test
        run: ./mvnw -B --no-transfer-progress -Dspotless.check.skip=true verify

      - name: Summarize coverage
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          [ -f "$csv" ] || { echo "No coverage report." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          awk -F, 'NR == 1 { for (i = 1; i <= NF; i++) col[$i] = i; next }
            { lc += $col["LINE_COVERED"]; lm += $col["LINE_MISSED"]; mc += $col["METHOD_COVERED"]; mm += $col["METHOD_MISSED"]
              bc += $col["BRANCH_COVERED"]; bm += $col["BRANCH_MISSED"] }
            END { print "### Coverage"; printf "Lines %.1f%% · methods %.1f%% · branches %.1f%% (floors: 90%% lines and methods, 79%% branches, a line floor per package)\n",
              100 * lc / (lc + lm), 100 * mc / (mc + mm), 100 * bc / (bc + bm) }' "$csv" >> "$GITHUB_STEP_SUMMARY"

      # Even when the tests pass: the reports are how a slow or skipped test is found.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-report
          path: target/site/jacoco
          retention-days: 14
          if-no-files-found: ignore

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check shell syntax
        run: for script in scripts/*.sh packaging/linux/AppRun; do bash -n "$script"; done

  # template:start (scripts/rename.sh removes this job along with itself)
  # The template must stay a working starting point: rename a copy and run the full gate on it.
  rename:
    name: Rename check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Rename a copy and build it
        run: |
          copy="$RUNNER_TEMP/renamed"
          git ls-files -z | xargs -0 -I{} install -D {} "$copy/{}"
          cd "$copy"
          bash scripts/rename.sh Acme io.acme.app
          if grep -rIl --exclude-dir=.git --exclude-dir=target -e 'ExampleApp' -e 'exampleapp' -e 'EXAMPLEAPP' -e 'com\.example\.app' -e 'com/example/app' .; then
            echo "::error::placeholders left after rename.sh (files above)"
            exit 1
          fi
          ./mvnw -B --no-transfer-progress verify
  # template:end
